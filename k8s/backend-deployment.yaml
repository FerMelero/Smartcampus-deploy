apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smartcampus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: smartcampus-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: smartcampus-config
            - secretRef:
                name: smartcampus-secret
          readinessProbe:
            httpGet:
              path: /health/db
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
