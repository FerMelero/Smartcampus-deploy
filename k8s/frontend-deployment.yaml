apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smartcampus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: smartcampus-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: smartcampus-config
                  key: BACKEND_URL
          readinessProbe:
            httpGet:
              path: /
              port: 80
